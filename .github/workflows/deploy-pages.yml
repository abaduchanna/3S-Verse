# Deploys the 3S Verse landing page to GitHub Pages on every push to main.
# Replaces the Netlify deploy (build credits exhausted); netlify.toml is
# kept only as a dormant fallback config.
#
# Publish dir: artifacts/landing-page/dist/public (vite.config.ts hard-requires
# PORT and BASE_PATH, so both are pinned below). The 404.html shipped from
# public/ routes friendly shortcuts (/privacy, /download, … -> their #/ views)
# and sends every other unknown path back to the landing page — no SPA
# byte-copy needed since the app only has the / route plus hash-routed views.
# NOTE: /invoice was removed on purpose — Invoice Studio is the seller's
# private tool and is no longer part of the public site.

name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # stale-artifact cleanup below (rerun safety)

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Rerunning a FAILED run re-runs upload-pages-artifact, which appends a
      # SECOND "github-pages" artifact to the same run — deploy-pages then
      # aborts with "Multiple artifacts named github-pages" (observed 2026-09-24).
      # Delete any stale artifacts for THIS run before uploading a fresh one.
      - name: Remove stale github-pages artifacts (rerun safety)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            | jq -r '.artifacts[] | select(.name == "github-pages") | .id' \
            | while read -r id; do
                echo "deleting stale artifact $id"
                gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" || true
              done

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @workspace/landing-page...

      - name: Build
        run: pnpm --filter @workspace/landing-page run build
        env:
          PORT: 3000
          BASE_PATH: /

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/landing-page/dist/public

      - id: deployment
        uses: actions/deploy-pages@v4
