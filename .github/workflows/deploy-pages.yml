# Deploys the 3S Verse landing page to GitHub Pages on every push to main.
# Replaces the Netlify deploy (build credits exhausted); netlify.toml is
# kept only as a dormant fallback config.
#
# Publish dir: artifacts/landing-page/dist/public (vite.config.ts hard-requires
# PORT and BASE_PATH, so both are pinned below). The 404.html shipped from
# public/ routes friendly shortcuts (/privacy, /download, … -> their #/ views)
# and sends every other unknown path back to the landing page — no SPA
# byte-copy needed since the app only has the / route plus hash-routed views.
# NOTE: /invoice was removed on purpose — Invoice Studio is the seller's
# private tool and is no longer part of the public site.

name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @workspace/landing-page...

      - name: Build
        run: pnpm --filter @workspace/landing-page run build
        env:
          PORT: 3000
          BASE_PATH: /

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/landing-page/dist/public

      - id: deployment
        uses: actions/deploy-pages@v4
