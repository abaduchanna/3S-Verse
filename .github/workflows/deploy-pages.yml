# Deploys the 3S Verse landing page to GitHub Pages on every push to main.
# Replaces the Netlify deploy (build credits exhausted); netlify.toml is
# kept only as a dormant fallback config.
#
# Publish dir: artifacts/landing-page/dist/public (vite.config.ts hard-requires
# PORT and BASE_PATH, so both are pinned below). 404.html is a byte-copy of
# index.html so client-side routes deep-link correctly (SPA fallback).

name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @workspace/landing-page...

      - name: Build
        run: pnpm --filter @workspace/landing-page run build
        env:
          PORT: 3000
          BASE_PATH: /

      - name: SPA fallback (404.html)
        run: cp artifacts/landing-page/dist/public/index.html artifacts/landing-page/dist/public/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/landing-page/dist/public

      - id: deployment
        uses: actions/deploy-pages@v4
