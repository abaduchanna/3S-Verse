    <!-- Brand fonts are self-hosted via @fontsource (bundled + fingerprinted

    <script>
      /* Always land on the hero: on a fresh load or refresh the browser must
         not restore the previous scroll position (Chrome/Firefox do this on
         reload) and must not re-anchor to a section hash (#contact, #services,
         …) left in the URL. In-page hash links keep working after load — this
         only normalizes the state the page starts in. */
      (function () {
        try { history.scrollRestoration = 'manual'; } catch (e) {}
        /* GitHub Pages 404 shim (v2): Pages has no SPA fallback, so this file
           is the landing spot for every unknown path. Friendly shortcuts are
           mapped onto their hash-routed views (trial -> #/download, order ->
           #/order), and ANY other unknown path goes back to the landing page
           instead of sitting on a dead splash screen. */
        var m = location.pathname.replace(/\/+$/, '').toLowerCase().match(/^\/(invoice|privacy|terms|refund|eula|security|download|order|trial)$/);
        if (m) {
          var view = m[1] === 'trial' ? 'download' : m[1];
          location.replace(location.origin + '/#/' + view + location.search);
          return;
        }
        if (location.pathname.replace(/\/+$/, '') !== '') {
          location.replace(location.origin + '/');
          return;
        }
        if (location.hash && !location.hash.startsWith('#/')) {
          /* "#/…" are app routes (e.g. #/invoice = Invoice Studio) — they
             must survive; only section anchors (#contact, …) are stripped. */
          try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
        }
        scrollTo(0, 0);
      })();
    </script>
