<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face{font-family:'Montserrat';src:url('fonts/montserrat-latin-400.woff2') format('woff2');font-weight:400;}
  @font-face{font-family:'Montserrat';src:url('fonts/montserrat-latin-600.woff2') format('woff2');font-weight:600;}
  @font-face{font-family:'Montserrat';src:url('fonts/montserrat-latin-700.woff2') format('woff2');font-weight:700;}
  @font-face{font-family:'Montserrat';src:url('fonts/montserrat-latin-800.woff2') format('woff2');font-weight:800;}
  @font-face{font-family:'DM Mono';src:url('fonts/dm-mono-latin-400.woff2') format('woff2');font-weight:400;}
  @font-face{font-family:'DM Mono';src:url('fonts/dm-mono-latin-500.woff2') format('woff2');font-weight:500;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1080px;height:1080px;overflow:hidden;}
  body{
    font-family:'Montserrat',sans-serif;color:#F1F5F9;
    background:
      radial-gradient(600px 600px at 12% 88%, rgba(59,130,246,.17), transparent 60%),
      radial-gradient(560px 560px at 90% 10%, rgba(16,185,129,.10), transparent 60%),
      linear-gradient(200deg,#090D26 0%,#0F1F3D 55%,#0A1628 100%);
    position:relative;
  }
  .shape1{position:absolute;right:-240px;top:24%;width:580px;opacity:.24;}
  .shape2{position:absolute;left:-180px;bottom:-210px;width:500px;opacity:.22;}
  .daychip{position:absolute;top:46px;right:50px;font-family:'DM Mono';font-size:19px;color:#64748B;letter-spacing:3px;border:1px solid rgba(255,255,255,.10);border-radius:999px;padding:11px 20px;z-index:3;background:rgba(10,22,40,.6);}
  .wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:66px 90px 56px;}
  .logo-badge{background:#0A1628;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:15px 24px;display:inline-flex;}
  .logo-badge img{height:52px;display:block;}
  .label{font-family:'DM Mono';font-size:20px;letter-spacing:6px;color:#60A5FA;font-weight:500;margin-top:36px;}
  h1{font-size:94px;line-height:1.05;font-weight:800;margin-top:20px;letter-spacing:-2px;}
  h1 .grad{background:linear-gradient(92deg,#60A5FA,#3B82F6 55%,#10B981);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{font-size:28px;font-weight:400;color:#94A3B8;margin-top:26px;line-height:1.5;max-width:840px;}
  .stats{display:flex;gap:22px;margin-top:48px;}
  .stat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:30px 34px 26px;width:250px;}
  .stat .n{font-size:64px;font-weight:800;letter-spacing:-1px;background:linear-gradient(92deg,#60A5FA,#3B82F6 55%,#10B981);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .stat .t{font-family:'DM Mono';font-size:17px;letter-spacing:3px;color:#94A3B8;margin-top:10px;}
  .cta{margin-top:50px;display:inline-flex;align-items:center;gap:16px;background:linear-gradient(92deg,#3B82F6,#2563EB);color:#fff;font-size:30px;font-weight:700;padding:26px 58px;border-radius:16px;box-shadow:0 18px 44px rgba(37,99,235,.35);}
  .url{font-family:'DM Mono';font-size:22px;color:#93C5FD;margin-top:24px;letter-spacing:1px;}
</style>
</head>
<body>
  <img class="shape1" src="shape-v1.webp">
  <img class="shape2" src="shape-v3.webp">
  <div class="daychip">06 / 07</div>
  <div class="wrap">
    <div class="logo-badge"><img src="logo-240.png"></div>
    <div class="label">WHY DEALERS SWITCH</div>
    <h1>Get your<br><span class="grad">evenings back.</span></h1>
    <div class="sub">Weekly admin — incentives, orders, rebates — handled<br>automatically by tools that don't take days off.</div>
    <div class="stats">
      <div class="stat"><div class="n">3</div><div class="t">TOOLS</div></div>
      <div class="stat"><div class="n">1</div><div class="t">DOWNLOAD</div></div>
      <div class="stat"><div class="n">7</div><div class="t">DAYS FREE</div></div>
    </div>
    <div class="cta">DOWNLOAD FREE TRIAL</div>
    <div class="url">3sverse.com</div>
  </div>
</body>
</html>
