# Netlify build configuration for 3S Verse
#
# The site is the Vite app in artifacts/landing-page inside this pnpm
# monorepo. Netlify's auto-detection looks at the repo root and finds
# nothing buildable — this file points it at the right directories.
#
# vite.config.ts hard-requires PORT and BASE_PATH to be set (it throws
# otherwise), so both are pinned in [build.environment].

[build]
  base = "artifacts/landing-page"
  # Install only what the landing-page package needs (plus its workspace
  # deps), then run its Vite build. Run from the workspace root so pnpm
  # resolves the lockfile and catalogs.
  command = "cd ../.. && pnpm install --frozen-lockfile --filter @workspace/landing-page... && pnpm --filter @workspace/landing-page run build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY_USE_PNPM = "true"
  PNPM_VERSION = "10.17.0"
  PORT = "3000"
  BASE_PATH = "/"

# Serverless backend for the contact form. Resolved relative to the base
# directory → artifacts/landing-page/netlify/functions. Zero npm deps;
# needs RESEND_API_KEY in the site's environment variables.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Contact form API — must be listed BEFORE the SPA catch-all below,
# otherwise every POST to /api/contact would be rewritten to index.html.
[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

# Visit counter API — same ordering rule as /api/contact: must be listed
# BEFORE the SPA catch-all below.
[[redirects]]
  from = "/api/visits"
  to = "/.netlify/functions/visits"
  status = 200
  force = true

# Dealer store APIs (order intake, customer order status, seller approval
# console) — same ordering rule: BEFORE the SPA catch-all.
[[redirects]]
  from = "/api/order"
  to = "/.netlify/functions/order"
  status = 200
  force = true

[[redirects]]
  from = "/api/order-status"
  to = "/.netlify/functions/order-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200
  force = true

# Single-page app: serve index.html for client-side routes (Netlify
# serves real files first, so assets are unaffected).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived caching for hashed build assets (they never change content).
# Netlify's default max-age=600 made every repeat visitor re-download the
# whole JS bundle after 10 minutes — the main repeat-load slowdown.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/shapes/*"
  [headers.values]
    Cache-Control = "public, max-age=1209600"

[[headers]]
  for = "/logo*"
  [headers.values]
    Cache-Control = "public, max-age=1209600"

[[headers]]
  for = "/favicon*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
